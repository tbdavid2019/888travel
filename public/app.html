<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>888漫步旅遊 · 888travel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECE7DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="888漫步旅遊">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="shortcut icon" href="/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#ECE7DC; --ink:#16130C; --muted:#635B4E; --faint:#A39A89;
    --line:rgba(22,19,12,.12); --line-strong:rgba(22,19,12,.22); --card:#FFFFFF;
    --cobalt:#1E40FF; --coral:#FF5A35; --amber:#E89A2B; --green:#1B8A57; --purple:#7C4DFF;
    --cream:#F4EFE4; --soft:#F6F2E9;
    --flight:var(--cobalt); --hotel:var(--green); --car:var(--amber); --ride:var(--purple); --rail:var(--coral); --restaurant:#FF5A35; --other:var(--muted);
    --display:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Heiti TC",sans-serif; --body:'Archivo',-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif; --mono:'JetBrains Mono',"SF Mono","PingFang TC",ui-monospace,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--canvas);color:var(--ink);font-family:var(--body);line-height:1.45;-webkit-font-smoothing:antialiased;padding:max(40px,env(safe-area-inset-top)) clamp(20px,5vw,72px) calc(80px + env(safe-area-inset-bottom))}
  ::selection{background:var(--coral);color:#fff}
  .wrap{max-width:1140px;margin:0 auto}
  @keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes floatPlane{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(6px,-6px) rotate(-4deg)}}
  @keyframes overlayIn{from{opacity:0}to{opacity:1}}
  @keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes dashFlow{to{background-position:-16px 0}}

  /* header */
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;animation:riseIn .6s ease both}
  .brand h1{font-family:var(--display);font-weight:800;font-size:clamp(54px,9vw,104px);line-height:.82;letter-spacing:-.035em;margin:0 0 12px}
  .brand p{font-size:16px;color:var(--muted);margin:0;max-width:440px;line-height:1.45}
  .ctl{display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
  .status{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;padding:7px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;text-transform:uppercase}
  .status .dot{width:6px;height:6px;border-radius:50%;display:inline-block;background:currentColor}
  .status.local{color:var(--muted);background:rgba(117,109,94,.1);border:1px solid rgba(117,109,94,.24)}
  .status.synced{color:var(--green);background:rgba(27,138,87,.1);border:1px solid rgba(27,138,87,.28)}
  .status.offline{color:var(--amber);background:rgba(232,154,43,.12);border:1px solid rgba(232,154,43,.32)}
  .btn{font-family:var(--body);font-weight:600;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:9px 18px;border-radius:999px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
  .btn:hover{box-shadow:0 6px 18px rgba(22,19,12,.1);transform:translateY(-1px)}
  .btn.solid{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .btn.solid:hover{transform:translateY(-2px)}

  /* hero */
  .hero{margin:34px 0 0;border-radius:28px;overflow:hidden;background:var(--ink);color:var(--cream);display:grid;grid-template-columns:1.25fr 1fr;min-height:320px;box-shadow:0 30px 60px -28px rgba(22,19,12,.55);animation:riseIn .7s ease .08s both}
  .hero-text{padding:36px 40px;display:flex;flex-direction:column;position:relative}
  .hero-top{display:flex;align-items:center;gap:12px;margin-bottom:auto}
  .pill-next{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.16em;background:var(--coral);color:#fff;padding:6px 14px;border-radius:999px}
  .hero-date{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:rgba(244,239,228,.6)}
  .hero-count{display:flex;align-items:baseline;gap:18px;margin:28px 0 4px}
  .hero-count .num{font-family:var(--display);font-weight:800;font-size:clamp(80px,12vw,128px);line-height:.8;letter-spacing:-.04em}
  .hero-count .lab{padding-bottom:10px}
  .hero-count .lab div{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05}
  .hero-count .lab .city{color:var(--coral)}
  .route{display:flex;align-items:center;gap:14px;margin:18px 0 26px}
  .route .code{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
  .route .line{flex:1;height:2px;background-image:linear-gradient(90deg,rgba(244,239,228,.5) 50%,transparent 50%);background-size:14px 2px;animation:dashFlow 1s linear infinite}
  .plane{color:var(--coral)}
  .plane.float{animation:floatPlane 3s ease-in-out infinite}
  .hero-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hero-btn{font-family:var(--body);font-weight:700;font-size:15px;color:var(--ink);background:var(--cream);border:none;padding:13px 24px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s ease}
  .hero-btn:hover{transform:translateY(-2px)}
  .hero-cap{font-family:var(--body);color:rgba(244,239,228,.65);font-size:14px}
  .hero-photo{position:relative}
  .hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero-fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 0%,rgba(22,19,12,.35) 35%,transparent 70%);pointer-events:none}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px;animation:riseIn .7s ease .14s both}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px}
  .stat .n{font-family:var(--display);font-weight:800;font-size:44px;line-height:.9;letter-spacing:-.03em}
  .stat .l{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}

  /* tabs */
  .tabs{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;width:fit-content;margin-top:30px}
  .tab{font-family:var(--body);font-weight:600;font-size:14px;padding:9px 20px;border-radius:999px;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:background .18s ease,color .18s ease;display:inline-flex;align-items:center;gap:8px}
  .tab.active{background:var(--ink);color:var(--cream)}
  .tab .cnt{opacity:.55;font-family:var(--mono);font-size:12.5px}

  /* list section */
  .section{margin-top:22px}
  .listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .listhead h2{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
  .add{font-family:var(--body);font-weight:700;font-size:13.5px;color:var(--cobalt);background:rgba(30,64,255,.08);border:none;padding:9px 18px;border-radius:999px;cursor:pointer;transition:background .15s ease}
  .add:hover{background:rgba(30,64,255,.16)}

  /* trip card */
  .trip{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 18px 40px -32px rgba(22,19,12,.5);margin-bottom:16px}
  .trip-head{display:grid;grid-template-columns:200px 1fr;position:relative}
  .photo-edit{position:absolute;top:10px;left:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:none;background:rgba(22,19,12,.55);color:#fff;font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:background .15s}
  .photo-edit:hover{background:rgba(22,19,12,.82)}
  .photo-prev{width:100%;height:150px;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--soft);margin-bottom:12px;display:block}
  .trip-photo{width:100%;height:100%;min-height:168px;object-fit:cover}
  .trip-body{padding:24px 26px}
  .trip-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .trip-top>div:first-child{flex:1;min-width:0}            /* let the route/title shrink + wrap instead of pushing the buttons off-screen */
  .trip-route{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
  .trip-route .code{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;overflow-wrap:anywhere;min-width:0}
  .trip h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 12px;overflow-wrap:anywhere}
  .trip h3.empty{color:var(--faint);font-weight:400}
  .chips{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .c-date{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .c-dur{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--ink);color:var(--cream);padding:5px 11px;border-radius:999px}
  .c-badge{font-family:var(--mono);font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
  .c-badge.soon{background:rgba(30,64,255,.1);color:var(--cobalt)}
  .c-badge.live{background:rgba(27,138,87,.12);color:var(--green)}
  .c-badge.done{background:rgba(22,19,12,.06);color:var(--faint)}
  .card-acts{display:flex;gap:8px;flex-shrink:0}
  .mini{font-family:var(--body);font-weight:600;font-size:14.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:999px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px}
  .mini:hover{background:var(--soft)}
  .mini.del{color:var(--coral);border-color:rgba(255,90,53,.3)}
  .tripnote-container{margin:14px 26px 0;position:relative;background:var(--soft);border:1px solid var(--line);border-left:3.5px solid var(--cobalt);border-radius:0 12px 12px 0;overflow:hidden}
  .tripnote{font-size:14.5px;line-height:1.68;color:var(--ink);padding:14px 18px;transition:max-height .25s ease}
  .tripnote.clamped{max-height:140px;overflow:hidden}
  .tripnote-fade{display:none}
  .tripnote.clamped + .tripnote-fade{display:block;position:absolute;bottom:35px;left:0;right:0;height:65px;background:linear-gradient(to bottom,rgba(248,245,238,0),var(--soft));pointer-events:none}
  .tripnote-toggle{width:100%;padding:9px 14px;background:rgba(22,19,12,.03);border:none;border-top:1px dashed var(--line);font-family:var(--body);font-size:13.5px;font-weight:600;color:var(--cobalt);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s ease}
  .tripnote-toggle:hover{background:rgba(22,19,12,.06);color:var(--coral)}

  /* Markdown styles across trip notes and AI copilot */
  .tripnote .md-p,.copilot-bubble .md-p{margin:0 0 10px}
  .tripnote .md-p:last-child,.copilot-bubble .md-p:last-child{margin-bottom:0}
  .tripnote .md-h2,.tripnote .md-h3,.tripnote .md-h4,.copilot-bubble .md-h2,.copilot-bubble .md-h3,.copilot-bubble .md-h4{font-family:var(--display);font-weight:700;color:var(--ink);margin:14px 0 6px;line-height:1.35}
  .tripnote .md-h4,.copilot-bubble .md-h4{font-size:15px}
  .tripnote .md-h3,.copilot-bubble .md-h3{font-size:16px}
  .tripnote .md-h2,.copilot-bubble .md-h2{font-size:17.5px}
  .tripnote .md-ul,.tripnote .md-ol,.copilot-bubble .md-ul,.copilot-bubble .md-ol{margin:6px 0 10px 20px;padding:0}
  .tripnote .md-ul li,.tripnote .md-ol li,.copilot-bubble .md-ul li,.copilot-bubble .md-ol li{margin-bottom:4px}
  .md-link{color:var(--cobalt);text-decoration:underline;text-underline-offset:2.5px;word-break:break-all;font-weight:500;transition:color .15s ease}
  .md-link:hover{color:var(--coral)}
  .md-code{font-family:var(--mono);font-size:13px;background:rgba(22,19,12,.06);padding:2px 5px;border-radius:4px;color:var(--ink)}
  .md-pre{background:rgba(22,19,12,.05);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:10px 0}
  .md-table-wrap{width:100%;overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
  .md-table{width:100%;border-collapse:collapse;font-size:13.5px;text-align:left}
  .md-table th{background:rgba(22,19,12,.05);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700;color:var(--ink);white-space:nowrap}
  .md-table td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink)}
  .md-table tr:last-child td{border-bottom:none}
  .md-quote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--amber);background:rgba(217,119,6,.06);border-radius:0 6px 6px 0;color:var(--ink);font-style:italic}

  /* toggle + timeline */
  .toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 26px;background:#F8F5EE;border:none;border-top:1px solid var(--line);cursor:pointer;margin-top:16px}
  .toggle .lbl{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;color:var(--muted)}
  .toggle .sq{width:8px;height:8px;border-radius:2px;display:inline-block}
  .toggle .rgt{font-family:var(--body);font-size:14.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
  .toggle .caret{font-size:12px}
  .itin{padding:8px 26px 22px;display:none}
  .trip.open .itin{display:block}
  .plan{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
  .plan .dotwrap{position:relative;display:flex;justify-content:center}
  .plan .dot{width:14px;height:14px;border-radius:50%}
  .plan .ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .plan .nm{font-family:var(--display);font-weight:700;font-size:17px}
  .plan .type{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:999px;text-transform:uppercase;display:inline-flex;align-items:center;gap:5px}
  .plan{cursor:pointer}
  .plan>div{min-width:0}
  .plan .ttl .nm{overflow-wrap:anywhere}
  .plan .sub{font-size:14.5px;line-height:1.6;color:var(--muted);margin-top:3px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .fb-badge{font-family:var(--mono);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(232,154,43,.14);color:var(--amber);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .rating-badge{font-family:var(--mono);font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,200,0,.18);color:#9E7300;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .plan .fb-sub{color:var(--amber);font-size:14px;margin-top:4px;display:flex;align-items:center;gap:6px}
  .plan .fb-sub .fb-tag{font-weight:700;font-family:var(--mono);font-size:12.5px;padding:3px 8px;border-radius:6px;background:rgba(232,154,43,.18);color:var(--amber);display:inline-flex;align-items:center;gap:4px}
  .pd-fb-card{margin-top:14px;background:rgba(232,154,43,.06);border:1px solid rgba(232,154,43,.25);border-radius:12px;padding:12px 14px}
  .pd-fb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .pd-fb-tag{font-size:12.5px;font-weight:700;color:var(--amber);display:flex;align-items:center;gap:5px}
  .pd-fb-tip{font-size:12px;color:var(--muted)}
  .pd-fb-name{font-family:var(--display);font-weight:700;font-size:16.5px;color:var(--ink);margin-bottom:4px}
  .pd-fb-addr{font-size:14.5px;color:var(--muted);margin-bottom:4px}
  .pd-fb-note{font-size:14.5px;color:var(--ink);margin-bottom:8px;padding:6px 10px;background:var(--soft);border-radius:6px;border:1px solid var(--line)}
  .pd-fb-actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .pd-fb-actions .btn{padding:8px 16px;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
  .places-box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.08);margin-top:6px}
  .places-item{padding:8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;text-align:left}
  .places-item:last-child{border-bottom:none}
  .places-item-header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .places-name{font-weight:700;font-size:15px;color:var(--ink)}
  .places-rating{font-family:var(--mono);font-size:13px;color:#9E7300;background:rgba(255,200,0,.15);padding:3px 9px;border-radius:999px;white-space:nowrap}
  .places-addr{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .places-acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .places-acts button, .places-acts a{font-size:13.5px;padding:6px 12px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  #g_places_btn:hover{background:rgba(255,90,53,.14)!important;transform:translateY(-1px);box-shadow:0 2px 8px rgba(255,90,53,.15)}
  #g_places_btn:active{transform:translateY(0)}
  .plan .pmeta{display:flex;align-items:center;gap:12px}
  .plan .when{font-family:var(--mono);font-size:14px;color:var(--ink);white-space:nowrap}
  .plan .x{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;line-height:1}
  .plan .x:hover{color:var(--coral);border-color:rgba(255,90,53,.35)}
  .itin .empty{color:var(--faint);font-size:14.5px;padding:6px 0 4px}
  .addplan{margin-top:16px;font-family:var(--body);font-weight:700;font-size:14.5px;color:var(--cobalt);background:rgba(30,64,255,.08);border:none;padding:10px 20px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .addplan.ical{margin-left:8px;color:var(--ink);background:var(--soft)}
  .destinfo{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;empty-cells:hide}
  .destinfo:empty{display:none}
  .destinfo .di{font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .destinfo .di em{color:var(--faint);font-style:normal}
  /* world map ("been there") */
  .map-loading{padding:48px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px}
  .map-wrap{background:#F4F0E6;border:1px solid var(--line);border-radius:18px;padding:10px;overflow:hidden}
  .worldmap{width:100%;height:auto;display:block}
  .worldmap .mk text{font-family:var(--mono)}
  .map-stat{margin:16px 2px 10px;font-family:var(--body);font-size:15px;color:var(--muted)}
  .map-stat b{color:var(--ink);font-family:var(--display);font-weight:700}
  .map-chips{display:flex;flex-wrap:wrap;gap:8px}
  .mc{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
  .mc .fl{font-size:17px;line-height:1}
  .mc .nm{font-weight:600;color:var(--ink)}
  .mc .ct{font-family:var(--mono);color:var(--coral);font-weight:700;font-size:13px}
  /* days away by year (calendar tab) */
  .yr-wrap{margin:20px 0 4px}
  .yr-lh{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .yr{margin-bottom:12px}
  .yr-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .yr-y{font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink)}
  .yr-n{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .yr-bar{height:8px;background:var(--soft);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .yr-bar span{display:block;height:100%;background:var(--cobalt);border-radius:999px}
  .yr-top{cursor:pointer;user-select:none}
  .yr-caret{display:inline-block;font-size:12px;color:var(--faint);transition:transform .15s ease}
  .yr.open .yr-caret{transform:rotate(90deg)}
  .yr-detail{display:none;margin-top:8px}
  .yr.open .yr-detail{display:block}
  .yr-trip{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
  .yr-tr{color:var(--ink);font-weight:600}
  .yr-td{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
  .yr-hint{font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--faint);font-size:12px}
  .addplan:hover{background:rgba(30,64,255,.16)}

  /* wishlist */
  .wish{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 28px;box-shadow:0 18px 40px -32px rgba(22,19,12,.5);margin-bottom:16px}
  .wish .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .wish h3{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 14px;letter-spacing:-.02em}
  .wcrit{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .wchip{font-family:var(--mono);font-size:12px;background:#F4F0E7;border:1px solid var(--line);padding:6px 12px;border-radius:999px}
  .wchip b{color:var(--cobalt)}
  .wchip.accent{font-weight:700;color:var(--cobalt);background:rgba(30,64,255,.08);border-color:transparent}
  .wish .note{color:var(--muted);margin:0;line-height:1.5;max-width:460px}
  .watch{display:inline-flex;align-items:center;gap:9px;margin-top:20px;font-family:var(--body);font-weight:700;font-size:14px;color:var(--cream);background:var(--ink);border:none;padding:12px 22px;border-radius:999px;cursor:pointer;text-decoration:none;transition:transform .15s ease}
  .watch:hover{transform:translateY(-2px)}

  /* empty states */
  .empty-state{background:var(--card);border:1px dashed var(--line);border-radius:24px;padding:64px 24px;text-align:center}
  .empty-state .h{font-family:var(--display);font-weight:700;font-size:22px;margin-bottom:8px}
  .empty-state p{color:var(--muted);margin:0 auto 18px;max-width:360px;line-height:1.5}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(22,19,12,.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;animation:overlayIn .2s ease both}
  .scrim.show{display:flex}
  .modal{width:100%;max-width:min(94vw,720px);background:var(--card);border-radius:26px;padding:32px 34px;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);animation:sheetIn .28s cubic-bezier(.2,.8,.2,1) both;max-height:92vh;overflow:auto}
  .modal h3{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin:0 0 24px}
  .modal h4{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:22px 0 12px}
  /* settings modal tabs */
  .set-tab-nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:1px}
  .set-tab-nav::-webkit-scrollbar{display:none}
  .set-tab-btn{border:none;background:transparent;padding:9px 13px;border-radius:10px 10px 0 0;font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:38px;transition:all .15s ease;border-bottom:2px solid transparent}
  .set-tab-btn:hover{color:var(--ink);background:rgba(22,19,12,.03)}
  .set-tab-btn.active{color:var(--coral);background:rgba(255,90,53,.07);border-bottom-color:var(--coral);font-weight:700}
  .set-tab-pane{display:none}
  .set-tab-pane.active{display:block;animation:fadeIn .2s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

  /* app footer */
  .app-footer{margin-top:64px;padding:26px 0 38px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14.5px}
  .foot-brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--ink);font-size:15px}
  .foot-ver{font-family:var(--mono);font-size:13px;color:var(--faint)}
  .foot-links{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:14px}
  .foot-link{color:var(--muted);text-decoration:none;transition:color .15s ease;display:inline-flex;align-items:center;gap:6px;font-weight:600}
  .foot-link:hover{color:var(--coral);text-decoration:underline}
  .foot-sep{color:var(--line)}
  .field{margin-bottom:18px}
  .field label{display:block;font-weight:600;font-size:15px;color:var(--ink);margin-bottom:8px}
  .field label .opt{color:var(--muted);font-weight:400;font-size:13.5px}
  .field input,.field select,.field textarea{width:100%;font-family:var(--body);font-size:16px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:13px 15px;outline:none}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cobalt);background:#fff}
  .field textarea{resize:vertical;min-height:60px;font-family:var(--body)}
  .field .mono{font-family:var(--mono);font-size:13px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
  .modal-actions{display:flex;gap:12px;margin-top:28px}
  .modal-actions.act-row{justify-content:flex-start;gap:8px;margin-top:0;flex-wrap:wrap}
  .modal-actions.act-row .btn{flex:0 0 auto;padding:10px 18px;font-size:14.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .hlp{border-bottom:1px solid var(--line)}
  .hlp summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:16px;padding:14px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .hlp summary::-webkit-details-marker{display:none}
  .hlp summary::after{content:"+";font-weight:400;font-size:20px;color:var(--faint)}
  .hlp[open] summary::after{content:"–"}
  .hlp .hlp-b{padding:0 0 16px;font-size:14.5px;color:var(--muted);line-height:1.65}
  .hlp .hlp-b b{color:var(--ink)}
  .hlp .hlp-b p{margin:0 0 10px}
  .pd-row{padding:12px 0;border-bottom:1px solid var(--line)}
  .pd-k{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--faint);text-transform:uppercase;margin-bottom:4px}
  .pd-v{font-size:15px;color:var(--ink);overflow-wrap:anywhere;line-height:1.55}
  .pd-v.mono{font-family:var(--mono);font-size:14px}
  .modal-actions .btn{flex:1;justify-content:center;text-align:center;padding:14px;font-weight:700;font-size:15px}
  .modal-actions .btn.solid{flex:1.4}
  .err{color:var(--coral);font-size:13.5px;margin:-6px 0 6px;min-height:1px}
  .hint{font-size:12.5px;color:var(--faint);margin-top:-10px;margin-bottom:12px;line-height:1.5}

  /* share overlay */
  .share-scrim{position:fixed;inset:0;background:rgba(22,19,12,.6);backdrop-filter:blur(8px);display:none;align-items:safe center;justify-content:center;gap:24px;padding:24px;z-index:60;overflow:auto;animation:overlayIn .2s ease both}
  .share-scrim.show{display:flex}
  .ig-card{width:432px;min-height:540px;flex-shrink:0;background:var(--ink);color:var(--cream);border-radius:26px;padding:34px 34px 28px;display:flex;flex-direction:column;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);animation:sheetIn .3s cubic-bezier(.2,.8,.2,1) both}
  .ig-head{display:flex;justify-content:space-between;align-items:flex-start}
  .ig-title{font-family:var(--display);font-weight:800;font-size:40px;line-height:.9;letter-spacing:-.03em;margin-top:6px}
  .ig-list{flex:1;display:flex;flex-direction:column;gap:7px;margin-top:20px}
  .ig-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:rgba(244,239,228,.06);border:1px solid rgba(244,239,228,.1);border-radius:14px;padding:11px 15px}
  .ig-route{display:flex;align-items:center;gap:8px}
  .ig-route .code{font-family:var(--display);font-weight:800;font-size:17px}
  .ig-label{font-family:var(--body);font-weight:600;font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ig-dates{font-family:var(--mono);font-size:12px;color:rgba(244,239,228,.7);margin-top:2px}
  .ig-days{text-align:center;flex-shrink:0}
  .ig-days .n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;color:var(--coral)}
  .ig-days .l{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:rgba(244,239,228,.65);text-transform:uppercase}
  .ig-foot{display:flex;justify-content:space-between;align-items:center;padding-top:16px;margin-top:8px;border-top:1px solid rgba(244,239,228,.14)}
  .ig-foot .meta{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:rgba(244,239,228,.75)}
  .ig-foot .handle{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--coral)}
  .ig-side{width:280px;flex-shrink:0;background:var(--card);border-radius:26px;padding:28px;box-shadow:0 40px 90px -30px rgba(0,0,0,.5);animation:sheetIn .3s cubic-bezier(.2,.8,.2,1) .04s both}
  .ig-side .k{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--ink)}
  .ig-side h3{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:8px 0 6px}
  .ig-side p{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 18px}
  .ig-side .btn{width:100%;justify-content:center;padding:14px;font-weight:700;margin-top:10px}
  .ig-side .btn:first-of-type{margin-top:0}
  /* share card (upcoming trips only) - exact Instagram story ratio (1080x1920 = 9:16),
     so a screenshot of the card fills a story with no crop */
  .ig-card.land{width:min(92vw,52dvh,430px);aspect-ratio:9/16;min-height:0;height:auto;padding:22px 22px 14px}
  .ig-card.land .ig-title{font-size:24px}
  .ig-card.land .ig-list{margin-top:10px;overflow:hidden;display:grid;gap:6px;grid-auto-rows:1fr;align-content:stretch}
  .ig-card.land .ig-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 14px;min-width:0}
  .ig-card.land .ig-route{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px}
  .ig-flag{font-size:15px;line-height:1;min-width:18px}
  .ig-card.land .ig-route .code{font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ig-card.land .ig-dates{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;line-height:1.3;margin-top:0;white-space:nowrap;color:rgba(244,239,228,.75)}
  .ig-card.land .ig-foot{padding-top:10px;margin-top:6px;gap:10px}
  .ig-card.land .ig-foot .meta{font-size:11px;white-space:nowrap}

  /* timeline tab - the horizontal "where I'm headed" strip */
  .tl-panel{background:var(--ink);color:var(--cream);border-radius:24px;padding:24px 28px 16px;box-shadow:0 18px 40px -32px rgba(22,19,12,.5);animation:riseIn .5s ease both}
  .tl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .tl-title{font-family:var(--display);font-weight:800;font-size:26px;line-height:.95;letter-spacing:-.02em}
  .tl-sub{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:rgba(244,239,228,.72);text-align:right;margin-top:4px}
  .tl-scroll{overflow-x:auto;padding-bottom:4px}
  .tl{position:relative;display:flex;justify-content:space-between;align-items:stretch;height:280px;margin:2px 6px}
  .tl-line{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,90,53,.45);transform:translateY(-50%)}
  .tl-node{position:relative;flex:1 1 0;min-width:130px}
  .tl-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--coral);border:3px solid var(--ink);z-index:2}
  .tl-card{position:absolute;left:50%;transform:translateX(-50%);width:calc(100% - 10px);max-width:150px;background:rgba(244,239,228,.07);border:1px solid rgba(244,239,228,.12);border-radius:12px;padding:8px 9px;text-align:center}
  .tl-card::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:2px;height:14px;background:rgba(255,90,53,.45)}
  .tl-node.up .tl-card{bottom:calc(50% + 15px)} .tl-node.up .tl-card::after{bottom:-14px}
  .tl-node.down .tl-card{top:calc(50% + 15px)} .tl-node.down .tl-card::after{top:-14px}
  .tl-city{font-family:var(--display);font-weight:800;font-size:15px;line-height:1.05;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl-date{font-family:var(--mono);font-size:11px;color:rgba(244,239,228,.65);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl-days{font-family:var(--display);font-weight:800;font-size:14px;color:var(--coral);margin-top:2px}
  .tl-empty{color:rgba(244,239,228,.6);font-size:14px;text-align:center;padding:60px 30px}

  .cal-toggle{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;width:fit-content;margin-bottom:18px}
  .cal-tab{font-family:var(--body);font-weight:600;font-size:13.5px;padding:7px 18px;border-radius:999px;border:none;background:transparent;color:var(--muted);cursor:pointer}
  .cal-tab.active{background:var(--ink);color:var(--cream)}
  .cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .cal-month{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px}
  .cal-mh{font-family:var(--display);font-weight:700;font-size:17px;margin-bottom:12px}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-dow{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center;padding-bottom:4px}
  .cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--ink);border-radius:8px}
  .cal-d.empty{visibility:hidden}
  .cal-d.trav{background:var(--c);color:#fff;font-weight:600}
  .cal-d.today{outline:2px solid var(--ink);outline-offset:-2px}
  .cal-legend{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
  .cal-lh{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
  .cal-leg{display:flex;align-items:center;gap:10px;font-family:var(--body);font-size:14px;padding:6px 0}
  .cal-leg .sw{width:12px;height:12px;border-radius:4px;flex:none}
  .cal-leg .dt{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-left:auto}
  @media(max-width:760px){.cal-grid{grid-template-columns:1fr}}
  .auth-scrim{position:fixed;inset:0;background:var(--canvas);display:none;align-items:center;justify-content:center;padding:24px;z-index:90}
  .auth-scrim.show{display:flex}
  .auth-card{width:100%;max-width:380px;text-align:center;animation:riseIn .5s ease both}
  .auth-mark{margin-bottom:14px}
  .auth-card h2{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.02em;margin:0 0 8px}
  .auth-card p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 18px}
  .auth-card input{width:100%;font-family:var(--body);font-size:15px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:13px 16px;outline:none;text-align:center}
  .auth-card input:focus{border-color:var(--cobalt);background:#fff}
  .auth-card .btn{width:100%;justify-content:center;padding:13px;font-weight:700;font-size:15px;margin-top:12px}
  .auth-err{color:var(--coral);font-size:13px;min-height:16px;margin-top:8px}
  .auth-foot{color:var(--faint);font-size:12px;margin-top:14px}
  .auth-tabs{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:18px}
  .auth-tab{flex:1;font-family:var(--body);font-size:13px;font-weight:600;padding:8px 12px;border:none;background:transparent;color:var(--muted);border-radius:999px;cursor:pointer;transition:all .15s ease}
  .auth-tab.active{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .auth-otp-row{display:flex;gap:8px;margin-top:10px}
  .auth-otp-row input{flex:1}
  .auth-otp-row .btn{width:auto;flex-shrink:0;padding:12px 16px;font-size:13px;margin:0}
  .otp-code-input{letter-spacing:6px;font-weight:700;font-size:22px;font-family:var(--mono)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--cream);font-size:13px;font-weight:500;padding:12px 20px;border-radius:999px;opacity:0;transition:.22s;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* Auth Mode Navigation (Login vs Register) */
  .auth-mode-nav{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0 16px;gap:4px}
  .auth-mode-btn{flex:1;font-family:var(--body);font-size:13.5px;font-weight:600;padding:8px 12px;border:none;background:transparent;color:var(--muted);border-radius:9px;cursor:pointer;transition:all .18s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .auth-mode-btn:hover{color:var(--ink)}
  .auth-mode-btn.active{background:var(--card);color:var(--coral);font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .auth-badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(22,19,12,.08);color:var(--muted)}

  /* Toggle Switch */
  .switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:var(--line);border-radius:24px;transition:.3s}
  .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  input:checked + .slider{background-color:var(--coral)}
  input:checked + .slider:before{transform:translateX(20px)}

  /* Admin User Table */
  .admin-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
  .admin-table th{text-align:left;padding:9px 12px;background:var(--soft);color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
  .admin-table td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink)}
  .admin-table tr:hover td{background:rgba(22,19,12,.02)}

  /* ===================== CJK & Chinese Typography Enhancements ===================== */
  html[lang*="zh"] {
    --display: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
    --body: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
    --muted: #5e5648; /* Strengthen contrast for Chinese ideogram strokes: 5.4:1 WCAG AA compliant */
  }
  html[lang*="zh"] body {
    line-height: 1.65;
    letter-spacing: 0.015em;
  }
  html[lang*="zh"] .brand h1 {
    font-size: clamp(34px, 6.5vw, 64px);
    line-height: 1.25;
    letter-spacing: 0;
  }
  html[lang*="zh"] .brand p {
    font-size: 15.5px;
    line-height: 1.65;
    max-width: 540px;
    letter-spacing: 0.01em;
  }

  /* Override wide Latin uppercase tracking and enforce Chinese text readability */

  /* Markdown & Rich Link Renderer (Zero-dependency, safe XSS) */
  function renderMarkdown(text){
    if(!text) return "";
    var raw = String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n");

    var codeBlocks = [];
    raw = raw.replace(/```([\s\S]*?)```/g, function(m, p1){
      var idx = codeBlocks.length;
      codeBlocks.push(p1);
      return "___CODE_BLOCK_" + idx + "___";
    });

    var inlineCodes = [];
    raw = raw.replace(/`([^`\n]+)`/g, function(m, p1){
      var idx = inlineCodes.length;
      inlineCodes.push(p1);
      return "___INLINE_CODE_" + idx + "___";
    });

    var escaped = esc(raw);

    escaped = escaped.replace(/___INLINE_CODE_(\d+)___/g, function(m, idx){
      return '<code class="md-code">' + esc(inlineCodes[+idx]) + '</code>';
    });

    escaped = escaped.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, function(m, label, url){
      return '<a class="md-link" href="' + url + '" target="_blank" rel="noopener">' + label + ' ↗</a>';
    });

    escaped = escaped.replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g, function(m, prefix, url){
      var endPunct = "";
      var pMatch = url.match(/[,.\uFF0C\u3002\uFF1B;\uFF09\)]+$/);
      if(pMatch){
        endPunct = pMatch[0];
        url = url.slice(0, -endPunct.length);
      }
      return prefix + '<a class="md-link" href="' + url + '" target="_blank" rel="noopener">' + url + ' ↗</a>' + endPunct;
    });

    escaped = escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    escaped = escaped.replace(/(^|[^\*])\*([^\*\n]+)\*([^\*]|$)/g, '$1<em>$2</em>$3');

    var blocks = escaped.split(/\n{2,}/);
    var html = blocks.map(function(b){
      b = b.trim();
      if(!b) return "";

      if(b.indexOf("___CODE_BLOCK_") !== -1){
        return b.replace(/___CODE_BLOCK_(\d+)___/g, function(m, idx){
          return '<pre class="md-pre"><code>' + esc(codeBlocks[+idx].trim()) + '</code></pre>';
        });
      }

      var lines = b.split(/\n/);
      var isTable = lines.length >= 2 && lines.every(function(l){ return /^\s*\|.*\|\s*$/.test(l); });
      if(isTable){
        var tRows = lines.filter(function(l){ return !/^\s*\|(?:\s*:?-+:?\s*\|)+\s*$/.test(l); });
        var tableHtml = '<div class="md-table-wrap"><table class="md-table">';
        tRows.forEach(function(row, rIdx){
          var cells = row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|");
          var tag = rIdx === 0 ? "th" : "td";
          tableHtml += '<tr>' + cells.map(function(c){ return '<' + tag + '>' + c.trim() + '</' + tag + '>'; }).join("") + '</tr>';
        });
        tableHtml += '</table></div>';
        return tableHtml;
      }

      if(/^###\s+/.test(b)){
        return '<h4 class="md-h4">' + b.replace(/^###\s+/, "") + '</h4>';
      }
      if(/^##\s+/.test(b)){
        return '<h3 class="md-h3">' + b.replace(/^##\s+/, "") + '</h3>';
      }
      if(/^#\s+/.test(b)){
        return '<h2 class="md-h2">' + b.replace(/^#\s+/, "") + '</h2>';
      }

      if(/^>\s+/.test(b)){
        return '<blockquote class="md-quote">' + b.replace(/^>\s+/gm, "").replace(/\n/g, "<br>") + '</blockquote>';
      }

      if(/^[-*•]\s+/m.test(b)){
        var ulItems = b.split(/\n/).map(function(l){
          var clean = l.replace(/^[-*•]\s+/, "").trim();
          return clean ? '<li>' + clean + '</li>' : '';
        }).join("");
        return '<ul class="md-ul">' + ulItems + '</ul>';
      }

      if(/^\d+\.\s+/m.test(b)){
        var olItems = b.split(/\n/).map(function(l){
          var clean = l.replace(/^\d+\.\s+/, "").trim();
          return clean ? '<li>' + clean + '</li>' : '';
        }).join("");
        return '<ol class="md-ol">' + olItems + '</ol>';
      }

      return '<p class="md-p">' + b.replace(/\n/g, '<br>') + '</p>';
    }).join("");

    return html;
  }

  async function geoPlace(name){
    name=(name||"").trim();if(!name)return null;
    var iataTz=IATA_TZ[name.toUpperCase()];
    var g=await geoCity(IATA[name.toUpperCase()]||name);
    if(g){if(!g.timezone&&iataTz)g.timezone=iataTz;return g;}
    // "Jurerê Internacional, Florianópolis" -> try each part until one geocodes
    var parts=name.split(/[,(\/]/).map(function(s){return s.trim();}).filter(Boolean);
    for(var i=0;i<parts.length&&!g;i++){if(parts[i]!==name)g=await geoCity(IATA[parts[i].toUpperCase()]||parts[i]);}
    if(g&&!g.timezone&&iataTz)g.timezone=iataTz;
    return g;
  }
  function distKm(a,b){var R=6371,toR=Math.PI/180,sLa=Math.sin((b.lat-a.lat)*toR/2),sLo=Math.sin((b.lon-a.lon)*toR/2),h=sLa*sLa+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*sLo*sLo;return 2*R*Math.asin(Math.sqrt(h));}

  function fmtTemp(c){return useUS()?Math.round(c*9/5+32):Math.round(c);}

  async function weatherFor(lat,lon,start,end){
    var key="wx:"+lat.toFixed(2)+","+lon.toFixed(2)+":"+start+":"+end;
    try{var ls=localStorage.getItem(key);if(ls){var o=JSON.parse(ls);if(o.t&&Date.now()-o.t<6*3600e3)return o.w;}}catch(e){}
    var w=null;
    try{
      var today=new Date(),s=new Date(start+"T00:00:00"),days=(s-today)/864e5,url,typical=false;
      if(days<=14&&(new Date(end+"T00:00:00")-today)/864e5>=-1){
        url="https://api.open-meteo.com/v1/forecast?timezone=auto&daily=temperature_2m_max,temperature_2m_min,weather_code&latitude="+lat+"&longitude="+lon+"&start_date="+start+"&end_date="+end;
      }else{
        var ly=function(d){return(parseInt(d.slice(0,4))-1)+d.slice(4);};typical=true;
        url="https://archive-api.open-meteo.com/v1/archive?timezone=auto&daily=temperature_2m_max,temperature_2m_min,weather_code&latitude="+lat+"&longitude="+lon+"&start_date="+ly(start)+"&end_date="+ly(end);
      }
      var r=await fetch(url);if(r.ok){var d=await r.json(),dy=d.daily||{},hi=(dy.temperature_2m_max||[]).filter(function(x){return x!=null;}),lo=(dy.temperature_2m_min||[]).filter(function(x){return x!=null;}),wc=dy.weather_code||[];
        if(hi.length&&lo.length)w={hi:Math.round(Math.max.apply(null,hi)),lo:Math.round(Math.min.apply(null,lo)),code:wc[Math.floor(wc.length/2)]||0,typical:typical};}
    }catch(e){}
    try{localStorage.setItem(key,JSON.stringify({t:Date.now(),w:w}));}catch(e){}
    return w;
  }

  async function fillDest(node,t){
    var g=await geoPlace(t.to);if(!g){node.innerHTML="";return;}
    var ci=CINFO[g.cc]||{},parts=[];
    var o=await geoPlace(t.from||home);          // no origin on the trip -> measure from home base
    if(o){var km=distKm(o,g);if(km>=1)parts.push('<span class="di">📏 '+fmtDist(km)+'</span>');}

    // Timezone & Local Time Clock
    var destTz = t.timezone || (g && g.timezone) || IATA_TZ[(t.to||"").toUpperCase()];
    if(destTz){
      var curDestTime = fmtDestTime(destTz);
      var homeTzVal = getHomeTz();
      var diffStr = fmtTimeDiff(destTz, homeTzVal);
      var offsetStr = fmtUtcOffset(destTz);
      var cityName = (destTz.split("/")[1]||destTz).replace(/_/g," ");
      var tip = (isZH() ? "目的地時區: " : "Destination TZ: ") + destTz + " (" + offsetStr + ")\n" + (isZH() ? "本人出發地時區: " : "Home TZ: ") + homeTzVal;
      parts.push('<span class="di tz-chip" title="'+esc(tip)+'" style="cursor:help">🕒 '+(curDestTime ? '<strong style="font-variant-numeric:tabular-nums;font-weight:600">'+curDestTime+'</strong> ' : '')+'<span class="tz-diff" style="opacity:.9">('+cityName+' · '+diffStr+')</span></span>');
    }

    if(t.start&&t.end){var w=await weatherFor(g.lat,g.lon,t.start,t.end);if(w)parts.push('<span class="di">'+wIcon(w.code)+' '+fmtTemp(w.lo)+'-'+fmtTemp(w.hi)+tempUnit()+(w.typical?(isZH()?' <em>常態氣候</em>':' <em>typical</em>'):'')+'</span>');}
    if(ci.cur==="EUR"){parts.push('<span class="di">💶 '+(isZH()?"歐元":"Euro")+'</span>');}
    else if(ci.cur){var fx=await fxRates();if(fx&&fx[ci.cur]){var pe=fx[ci.cur],pu=fx.USD?fx[ci.cur]/fx.USD:0;parts.push('<span class="di">💱 €1='+fmtMoney(pe)+' '+ci.cur+(pu?' · $1='+fmtMoney(pu):'')+'</span>');}else parts.push('<span class="di">💱 '+ci.cur+'</span>');}
    if(ci.plug)parts.push('<span class="di">🔌 '+(isZH()?"規格 ":"Type ")+ci.plug+(ci.volt?' · '+ci.volt:'')+'</span>');
    if(ci.em)parts.push('<span class="di">🆘 '+ci.em+'</span>');
    node.innerHTML=parts.join('');
  }

  function icsForTrip(t){
    var dt=function(d){return d.replace(/-/g,"");};
    var dtEnd=function(d){var x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+1);return x.toISOString().slice(0,10).replace(/-/g,"");};
    var tz=t.timezone||getHomeTz();
    var desc=(t.segments||[]).map(function(s){return (s.type||"")+": "+(s.name||"");}).join("\\n");
    if(tz) desc = (desc ? desc + "\\n" : "") + "Timezone: " + tz;
    return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//888travel//EN","X-WR-TIMEZONE:"+tz,"BEGIN:VEVENT","UID:"+t.id+"@travel",
      "DTSTART;VALUE=DATE:"+dt(t.start),"DTEND;VALUE=DATE:"+dtEnd(t.end),
      "SUMMARY:Trip: "+((t.label||codeify(t.to)||"Travel").replace(/[,;]/g," ")),"DESCRIPTION:"+desc,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  }

  /* ===================== trip card + itinerary (new look, preserved data) ===================== */
  // Same-day plans order by their TIME, which lives in the note ("TP1328
  // OPO-LGW 09:00-11:20", "18:00-21:30 · dinner"): first clock time found is
  // the sort key, no time = midday. Otherwise a morning flight rendered after
  // dinner just because it was imported later.
  function segSortKey(s){
    if(!s || !s.start) return "9999-12-31T12:00";
    var tm = /[T\s](\d{1,2}):(\d{2})/.exec(s.start);
    if(tm){
      return s.start.slice(0, 10) + "T" + ("0" + tm[1]).slice(-2) + ":" + tm[2];
    }
    var m = /([01]?\d|2[0-3]):([0-5]\d)/.exec(s.note || "");
    return s.start.slice(0, 10) + "T" + (m ? ("0" + m[1]).slice(-2) + ":" + m[2] : "12:00");
  }
  // No time known on either? Travel logic breaks the tie: you fly, then you
  // check in - flights first, transfers next, hotel after, the rest last.
  var SEG_RANK={flight:0,rail:1,car:2,ride:3,hotel:4,restaurant:5};
  function segRank(s){return SEG_RANK[s.type]!==undefined?SEG_RANK[s.type]:6;}
  function segCmp(a,b){var ka=segSortKey(a),kb=segSortKey(b);return ka<kb?-1:ka>kb?1:segRank(a)-segRank(b);}
  function dedupeSegs(segs){
    var seen={}, out=[];
    for(var i=0; i<segs.length; i++){
      var s=segs[i];
      var key=s.conf || (s.type + "|" + s.name + "|" + s.start);
      if(seen[key]) continue;
      seen[key]=1;
      out.push(s);
    }
    return out.sort(segCmp);
  }
  function itinerary(t){

  // Google Flights only parses q= reliably with explicit dates, so turn
  // "August, ~7 days" into a concrete window (5th of that month + trip length).
  function wishWindow(w){
    var days=parseInt(w.days,10)||7;
    var mi=-1;if(w.month)mi=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(w.month.trim().toLowerCase().slice(0,3));
    var today=new Date(),start;
    if(mi>=0){start=new Date(today.getFullYear(),mi,5);if(start<=today)start=new Date(today.getFullYear()+1,mi,5);}
    else{start=new Date(today.getFullYear(),today.getMonth(),today.getDate()+30);}
    var end=new Date(start);end.setDate(end.getDate()+days);
    return {s:isoOf(start),e:isoOf(end)};
  }
  function wishCard(w){
    var orig=w.from||home;
    var d=wishWindow(w);
    var q="flights from "+orig+" to "+(w.dest?w.dest:"anywhere")+" on "+d.s+" through "+d.e;
    var url="https://www.google.com/travel/flights?q="+encodeURIComponent(q);
    var chips='<span class="wchip">from <b>'+esc(orig)+'</b></span>';
    if(w.days)chips+='<span class="wchip">~<b>'+esc(w.days)+'</b> days</span>';
    if(w.month)chips+='<span class="wchip accent">'+esc(w.month)+'</span>';
    if(w.budget)chips+='<span class="wchip">under <b>'+esc(w.budget)+'</b></span>';
    return '<article class="wish" data-id="'+w.id+'">'+
      '<div class="top"><div><h3>'+esc(w.dest||"Anywhere")+'</h3>'+
        '<div class="wcrit">'+chips+'</div>'+
        (w.note?'<p class="note">'+esc(w.note)+'</p>':'')+'</div>'+
        '<div class="card-acts"><button class="mini" data-editw="'+w.id+'">Edit</button><button class="mini del" data-delw="'+w.id+'">Delete</button></div></div>'+
      '<a class="watch" href="'+url+'" target="_blank" rel="noopener">'+plane(16,"color:var(--coral)")+' Watch fares from '+esc(orig)+'</a>'+
    '</article>';
  }

  /* ===================== calendar overview (3 / 6 / 12 months) ===================== */
  function isoOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  var CAL_PAL=["var(--cobalt)","var(--coral)","var(--green)","var(--purple)","var(--amber)","var(--rail)"];
  function renderCalendar(){
    var dayInfo={};
    var sorted=trips.filter(function(t){return t.start&&t.end;}).sort(function(a,b){return a.start<b.start?1:-1;});
    sorted.forEach(function(t,i){
      var col=CAL_PAL[i%CAL_PAL.length],d=parse(t.start),end=parse(t.end),guard=0;
      while(d<=end&&guard<400){var iso=isoOf(d);if(!dayInfo[iso])dayInfo[iso]={color:col,label:(t.label||codeify(t.to)||"Trip")};d.setDate(d.getDate()+1);guard++;}
    });
    var now=new Date();now.setDate(1);now.setHours(0,0,0,0);
    var html='<div class="cal-toggle">'+[3,6,12].map(function(m){return '<button class="cal-tab'+(m===calMonths?' active':'')+'" data-cal="'+m+'">'+m+(isZH()?' 個月':' months')+'</button>';}).join('')+'</div><div class="cal-grid">';
    for(var mi=0;mi<calMonths;mi++)html+=monthCard(new Date(now.getFullYear(),now.getMonth()+mi,1),dayInfo);
    html+='</div>';
    // days away per calendar year (Jan 1 -> Dec 31). Header counts each calendar
    // day once (overlaps deduped); tap a year to see exactly which trips and dates
    // make it up - so a wrong stored date shows itself immediately.
    var dayset={};
    trips.forEach(function(t){if(!t.start||!t.end)return;var d=parse(t.start),end=parse(t.end),guard=0;while(d<=end&&guard<800){dayset[isoOf(d)]=1;d.setDate(d.getDate()+1);guard++;}});
    var yearCount={};Object.keys(dayset).forEach(function(iso){var y=iso.slice(0,4);yearCount[y]=(yearCount[y]||0)+1;});
    var years=Object.keys(yearCount).sort().reverse();
    if(years.length){
      var maxY=Math.max.apply(null,years.map(function(y){return yearCount[y];}));
      var clipYear=function(t,y){var ys=y+"-01-01",ye=y+"-12-31";var s=t.start<ys?ys:t.start,e=t.end>ye?ye:t.end;if(s>e)return null;return{s:s,e:e,days:dayDiff(s,e)+1};};
      var yhtml=years.map(function(y){
        var n=yearCount[y],pct=Math.max(4,Math.round(n/maxY*100));
        var parts=trips.filter(function(t){return t.start&&t.end;}).map(function(t){return{t:t,c:clipYear(t,y)};}).filter(function(x){return x.c;}).sort(function(a,b){return a.c.s<b.c.s?-1:1;});
        var rows=parts.map(function(x){
          var route=(x.t.from?esc(codeify(x.t.from))+' → ':'')+esc(codeify(x.t.to));
          var spans=x.t.start<y+"-01-01"||x.t.end>y+"-12-31";
          return '<div class="yr-trip"><span class="yr-tr">'+route+'</span><span class="yr-td">'+fmtRange(x.t.start,x.t.end)+' · '+x.c.days+'d'+(spans?' in '+y:'')+'</span></div>';
        }).join('');
        return '<div class="yr"><div class="yr-top" data-yr="'+y+'"><span class="yr-y">'+y+' <span class="yr-caret">▸</span></span><span class="yr-n">'+(isZH()?(n+" 天在旅途中"):(n+' day'+(n===1?'':'s')+' away'))+'</span></div><div class="yr-bar"><span style="width:'+pct+'%"></span></div><div class="yr-detail">'+(rows||('<div class="yr-trip"><span class="yr-tr">'+(isZH()?"無旅程":"No trips")+'</span></div>'))+'</div></div>';
      }).join('');
      html+='<div class="yr-wrap"><div class="yr-lh">'+(isZH()?"年度離家旅行天數 ":"Days away by year ")+'<span class="yr-hint">'+(isZH()?"— 點擊年份查看旅程明細":"— tap a year for the breakdown")+'</span></div>'+yhtml+'</div>';
    }
    var legend=sorted.map(function(t,i){
      var col=CAL_PAL[i%CAL_PAL.length],route=(t.from?esc(codeify(t.from))+' → ':'')+esc(codeify(t.to));
      return '<div class="cal-leg"><span class="sw" style="background:'+col+'"></span>'+route+'<span class="dt">'+fmtRange(t.start,t.end)+'</span></div>';
    }).join('');
    html+=legend?'<div class="cal-legend"><div class="cal-lh">'+(isZH()?"你的旅程清單":"Your Trips")+'</div>'+legend+'</div>':'<div class="empty-state" style="margin-top:18px"><div class="h">'+(isZH()?"尚未預訂任何行程":"Nothing booked yet")+'</div><p>'+(isZH()?"新增旅程後，你在外旅行的日子就會在月份日曆上一一點亮。":"Add a trip and the days you’re away light up across the months.")+'</p></div>';
    document.getElementById("list").innerHTML=html;
    document.querySelectorAll(".cal-tab").forEach(function(b){b.onclick=function(){calMonths=+b.dataset.cal;render();};});
    document.querySelectorAll(".yr-top").forEach(function(b){b.onclick=function(){b.parentNode.classList.toggle("open");};});
  }
  function monthCard(mDate,dayInfo){
    var y=mDate.getFullYear(),m=mDate.getMonth();
    var off=(new Date(y,m,1).getDay()+6)%7,daysIn=new Date(y,m+1,0).getDate(),todayIso=todayISO();
    var dow=(isZH()?["一","二","三","四","五","六","日"]:["Mo","Tu","We","Th","Fr","Sa","Su"]).map(function(x){return '<div class="cal-dow">'+x+'</div>';}).join('');
    var cells='';for(var i=0;i<off;i++)cells+='<div class="cal-d empty"></div>';
    for(var dd=1;dd<=daysIn;dd++){
      var iso=y+"-"+String(m+1).padStart(2,"0")+"-"+String(dd).padStart(2,"0"),info=dayInfo[iso];
      var cls="cal-d"+(info?" trav":"")+(iso===todayIso?" today":"");
      cells+='<div class="'+cls+'"'+(info?' style="--c:'+info.color+'" title="'+esc(info.label)+'"':'')+'>'+dd+'</div>';
    }
    var mTitle = isZH() ? (y+"年 "+getMon(m)) : (MON[m]+' '+y);
    return '<div class="cal-month"><div class="cal-mh">'+mTitle+'</div><div class="cal-days">'+dow+cells+'</div></div>';
  }

  function mapProj(lon,lat){return [(lon+180)/360*1000,(90-lat)/180*500];}
  function flagEmoji(cc){if(!cc||cc.length!==2)return"🌍";try{return String.fromCodePoint.apply(null,cc.toUpperCase().split("").map(function(c){return 0x1F1E6+c.charCodeAt(0)-65;}));}catch(e){return"🌍";}}
  async function renderMap(){
    var listEl=document.getElementById("list");
    listEl.innerHTML='<div class="map-loading">Charting your travels…</div>';
    var today=todayISO(),visited={};
    for(var i=0;i<trips.length;i++){var t=trips[i];if(!t.to||!t.start)continue;if(dayDiff(today,t.start)>0)continue;
      var g=await geoCity(t.to);if(!g||!g.cc)continue;var cc=g.cc.toLowerCase();
      if(!visited[cc])visited[cc]={count:0,country:g.country||t.to,lat:g.lat,lon:g.lon,cc:cc};
      visited[cc].count++;}
    var ccs=Object.keys(visited);
    if(!ccs.length){listEl.innerHTML='<div class="empty-state"><div class="h">No stamps yet</div><p>Once a trip’s start date has passed, that country lights up here with a visit count.</p></div>';return;}
    var maxc=1;ccs.forEach(function(c){if(visited[c].count>maxc)maxc=visited[c].count;});
    var base="";for(var k in WORLD_PATHS){if(!WORLD_PATHS.hasOwnProperty(k))continue;var v=visited[k];var fill=v?"var(--cobalt)":"#dcd5c6";var op=v?(0.45+0.55*(v.count/maxc)).toFixed(2):"1";base+='<path d="'+WORLD_PATHS[k]+'" fill="'+fill+'" fill-opacity="'+op+'" stroke="#ECE7DC" stroke-width="0.6"/>';}
    var badges="";ccs.forEach(function(c){var v=visited[c];if(v.lat==null||v.lon==null)return;var p=mapProj(v.lon,v.lat);badges+='<g class="mk"><circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="9" fill="var(--coral)" stroke="#fff" stroke-width="1.5"></circle><text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3.3).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">'+v.count+'</text></g>';});
    var totalVisits=ccs.reduce(function(a,c){return a+visited[c].count;},0);
    var svg='<svg class="worldmap" viewBox="0 8 1000 415" preserveAspectRatio="xMidYMid meet">'+base+badges+'</svg>';
    var sorted=ccs.map(function(c){return visited[c];}).sort(function(a,b){return b.count-a.count||a.country.localeCompare(b.country);});
    var chips=sorted.map(function(v){return '<div class="mc"><span class="fl">'+flagEmoji(v.cc)+'</span><span class="nm">'+esc(v.country)+'</span><span class="ct">×'+v.count+'</span></div>';}).join("");
    var head='<div class="map-stat"><b>'+ccs.length+'</b> '+(isZH()?"個國家/地區 · ":" countr"+(ccs.length===1?'y':'ies')+' · ')+'<b>'+totalVisits+'</b> '+(isZH()?"次造訪":" visit"+(totalVisits===1?'':'s'))+'</div>';
    listEl.innerHTML='<div class="map-wrap">'+svg+'</div>'+head+'<div class="map-chips">'+chips+'</div>';
  }

    updateStaticTexts();
    renderHero();
    renderStats();
    document.getElementById("listTitle").textContent=tab==="upcoming"?(isZH()?"即將啟程":"Upcoming"):tab==="past"?(isZH()?"歷史回憶":"Past"):tab==="map"?(isZH()?"足跡地圖":"Been there"):tab==="timeline"?(isZH()?"我的行程方向":"Where I’m headed"):(isZH()?"行事曆總覽":"Calendar");
    document.getElementById("addBtn").style.display=(tab==="calendar"||tab==="map"||tab==="timeline")?"none":"";
    document.getElementById("addBtn").textContent=isZH()?"+ 新增旅程":"+ Add trip";
    var list=document.getElementById("list");
    if(tab==="map"){renderMap();return;}
    if(tab==="timeline"){renderTimeline();return;}
    if(tab==="calendar"){renderCalendar();hydratePhotos();return;}
    var up=trips.filter(isUpcoming).sort(byStart);
    var past=trips.filter(function(t){return!isUpcoming(t);}).sort(function(a,b){return a.start>b.start?-1:1;});
    if(tab==="upcoming")list.innerHTML=up.length?up.map(tripCard).join(""):emptyState(isZH()?"暫無即將啟程的旅程":"Nothing on the horizon",isZH()?"新增下一趟旅程，立即開啟出發倒數。":"Add your next trip to start the countdown.");

  function renderTimeline(){

      return '<div class="tl-node '+(i%2===0?"up":"down")+'">'+
        '<div class="tl-card"><div class="tl-city">'+esc(codeify(t.to))+'</div>'+
          '<div class="tl-date">'+esc(fmtRange(t.start,t.end))+'</div>'+
          '<div class="tl-days">'+duration(t.start,t.end)+'d</div></div>'+
        '<span class="tl-dot"></span></div>';
    }).join("");
    var totalDays=up.reduce(function(a,t){return a+duration(t.start,t.end);},0);
    var body=up.length
      ? '<div class="tl-scroll"><div class="tl" style="min-width:'+Math.max(up.length*150,520)+'px"><span class="tl-line"></span>'+nodes+'</div></div>'

      '<div class="tl-head"><div class="tl-title">'+(isZH()?"我的行程<br>方向":"Where I’m<br>headed")+'</div>'+
        '<div class="tl-sub">'+(isZH()?(up.length+" 趟旅程 · 倒數 "+totalDays+" 天"):(up.length+' trip'+(up.length===1?"":"s")+' · '+totalDays+' days ahead'))+'</div></div>'+

  }

  async function saveSeg(){
    var tripId=modal.dataset.segTrip,sid=modal.dataset.segSid;
    var tr=trips.find(function(x){return x.id===tripId;});if(!tr)return;
    var type=val("g_type"),name=val("g_name"),addr=val("g_addr"),conf=val("g_conf"),note=val("g_note");
    var startDate=val("g_start_date"),startTime=val("g_start_time");
    var endDate=val("g_end_date"),endTime=val("g_end_time");
    var start=startDate?(startTime?(startDate+"T"+startTime):startDate):"";
    var end=endDate?(endTime?(endDate+"T"+endTime):endDate):"";
    if(!endDate&&endTime&&startDate){
      end=startDate+"T"+endTime;
    }
    var fbName=val("g_fb_name"),fbAddr=val("g_fb_addr"),fbNote=val("g_fb_note");
    var err=document.getElementById("gerr");err.textContent="";
    if(!name){err.textContent=isZH()?"請為此規劃填寫名稱。":"Give the plan a name.";return;}
    tr.segments=tr.segments||[];

    var segData = {
      type: type,
      name: name,
      address: addr,
      note: note,
      start: start,
      end: end,
      source: "manual"
    };
    if(fbName){
      segData.fallback = {
        name: fbName,
        address: fbAddr,
        note: fbNote
      };
      if(currentFallbackPlace){
        if(currentFallbackPlace.rating) segData.fallback.rating = currentFallbackPlace.rating;
        if(currentFallbackPlace.userRatingsTotal) segData.fallback.userRatingsTotal = currentFallbackPlace.userRatingsTotal;
        if(currentFallbackPlace.openNow !== undefined) segData.fallback.openNow = currentFallbackPlace.openNow;
        if(currentFallbackPlace.mapsUrl) segData.fallback.mapsUrl = currentFallbackPlace.mapsUrl;
        if(currentFallbackPlace.placeId) segData.fallback.placeId = currentFallbackPlace.placeId;
      }
    } else {
      segData.fallback = null;
    }
    if(currentPlace){
      if(currentPlace.rating) segData.rating = currentPlace.rating;
      if(currentPlace.userRatingsTotal) segData.userRatingsTotal = currentPlace.userRatingsTotal;
      if(currentPlace.openNow !== undefined) segData.openNow = currentPlace.openNow;
      if(currentPlace.mapsUrl) segData.mapsUrl = currentPlace.mapsUrl;
      if(currentPlace.placeId) segData.placeId = currentPlace.placeId;
    }

    if(sid){
      var s=tr.segments.find(function(x){return x.sid===sid;});
      if(s){
        segData.source = "manual";
        segData.conf = conf || s.conf;
        Object.assign(s, segData);
        if(!fbName) delete s.fallback;
      }
    } else {
      segData.sid = uid();
      segData.source = "manual";
      segData.conf = conf || ("man:" + uid());
      tr.segments.push(segData);
    }
    tr.segments.sort(function(a,b){return(a.start||"")<(b.start||"")?-1:1;});
    await persistTrip(tr,"update");closeModal();render();toast(sid?(isZH()?"細項已更新":"Plan updated"):(isZH()?"細項已新增":"Plan added"));
  }
  async function delSeg(tripId,sid){
    if(!confirm(isZH()?"確定要刪除此細項嗎？下次同步時不會再次復原。":"Delete this plan? It will not come back on the next sync."))return;
    var tr=trips.find(function(x){return x.id===tripId;});if(!tr)return;
    var seg=(tr.segments||[]).find(function(x){return x.sid===sid;});
    tr.segments=(tr.segments||[]).filter(function(x){return x.sid!==sid;});
    // Tell the worker to REMEMBER this deletion (tombstone by conf) so no sync -
    // calendar, Gmail, re-import - ever re-adds it. Manual plans go through
    // the same path. Falls back to a plain trip save in local mode.
    if(settings.workerUrl){
      try{await fetch(settings.workerUrl+"/segments/delete",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},authHeaders()),body:JSON.stringify({tripId:tripId,sid:sid,conf:seg&&seg.conf})});}
      catch(e){}
    }
    await save("trips",trips);render();toast(isZH()?"細項已移除——下次同步不會再次出現":"Plan removed - it won't come back");
  }

        '<p>Once your keys are set up, the app refreshes itself <b>once a day at 18:00 UTC</b> (19:00 Portugal in summer). It also syncs whenever you add or edit a trip, and the <b>Sync now</b> button runs the exact same job on demand.</p><p>Forwarded emails don’t wait for that: an <b>hourly background check</b> reads new mail and files it — even with the app closed and your phone in your pocket.</p><p>Each sync reads your calendar and inbox for new bookings and writes one \u201cTrip\u201d block per trip to your Google Calendar.</p>')+

    function renderModelOptions(p, modelsList, activeVal){
      var list = (modelsList && modelsList.length) ? modelsList : (LLM_RECOMMENDED_MODELS[p] || []);
      var html = '<option value="">' + (isZH() ? ('-- 請由下拉選單選取模型' + (modelsList && modelsList.length ? ('（共 ' + modelsList.length + ' 個可用）') : '') + ' --') : ('-- Select a model' + (modelsList && modelsList.length ? (' (' + modelsList.length + ' available)') : '') + ' --')) + '</option>';
      var hasActive = false;
      list.forEach(function(m){
        if(m === activeVal) hasActive = true;
        html += '<option value="' + esc(m) + '"' + (m === activeVal ? ' selected' : '') + '>' + esc(m) + '</option>';
      });
      if(activeVal && !hasActive && activeVal !== "__custom__"){
        html += '<option value="' + esc(activeVal) + '" selected>' + esc(activeVal) + (isZH() ? ' (目前設定)' : ' (current)') + '</option>';
      }
      html += '<option value="__custom__">' + (isZH() ? '✏️ 手動自訂輸入…' : '✏️ Custom model ID…') + '</option>';
      return html;
    }

          if(d.unfiled&&d.unfiled.length){

      var gTraceBtn = document.getElementById("gTrace");
      if(gTraceBtn) gTraceBtn.onclick=async function(){

        setGStatus(isZH()?"正在對您最新轉發/符合條件的郵件執行完整診斷…":"Tracing your newest forwarded / matching email through every stage\u2026");
        try{var r=await fetch(apiBase()+"/gmail/trace",{headers:authHeaders()});var d=await r.json();
          if(!d.ok){setGStatus('<span style="color:var(--coral)">\u25cb '+esc(d.error||(isZH()?"診斷失敗":"Trace failed"))+'</span>');return;}
          var L=[];

          if(d.fallbackQueryUsed)L.push('<span class="opt">'+(isZH()?'未找到 +trip 信件 — 改為診斷最新符合預訂搜尋的信件。':'No +trip mail found \u2014 traced the newest booking-search match instead.')+'</span>');
          if(d.textLength!==undefined)L.push((isZH()?'已讀取 '+d.textLength+' 字元內容':'Read '+d.textLength+' characters of text')+(d.alreadySeen?(isZH()?' <span style="color:var(--amber)">(此信件已被標記為已處理 — 可點擊「重新掃描信箱」清除)</span>':' <span style="color:var(--amber)">(this email is marked as already processed \u2014 Re-scan inbox to clear that)</span>'):''));
          if(d.parsed)L.push((isZH()?'已解析：':'Parsed: ')+'<b>'+esc(d.parsed.name||"?")+'</b> ('+esc(d.parsed.type||"?")+", "+esc(d.parsed.start||"?")+(d.parsed.end&&d.parsed.end!==d.parsed.start?' \u2013 '+esc(d.parsed.end):'')+')');
          L.push((d.step==="done"&&d.result.indexOf("Would file")===0?'<span style="color:var(--green)">\u25cf ':'<span style="color:var(--amber)">\u25d0 ')+esc(d.result)+'</span>');

      async function inboxPipeline(clean){
        var btnIds=["gSave","gConnect","gTest","gRescan","gReset","gTrace","gClear"],i,el;
        for(i=0;i<btnIds.length;i++){el=document.getElementById(btnIds[i]);if(el)el.disabled=true;}
        try{
          if(clean){
            setGStatus(isZH()?'正在清除自動匯入的規劃…':'Removing auto-imported plans…');
            var rr=await fetch(apiBase()+"/plans/reset",{method:"POST",headers:authHeaders()});
            var dd=await rr.json().catch(function(){return{};});
            if(!rr.ok){setGStatus('<span style="color:var(--coral)">○ '+esc(dd.error||(isZH()?"無法清除":"Could not clean"))+'</span>');return;}
            setGStatus(isZH()?('已清除 '+(dd.removed||0)+' 個匯入細項 — 正在重新匯入…'):('Removed '+(dd.removed||0)+' imported plan'+(dd.removed===1?'':'s')+' — re-importing fresh…'));
            await refresh();
          }else{
            setGStatus(isZH()?'正在從頭重新讀取過去一年的郵件…':'Re-reading the last year of email from scratch…');
            var r0=await fetch(apiBase()+"/gmail/rescan",{method:"POST",headers:authHeaders()});
            if(!r0.ok){setGStatus('<span style="color:var(--coral)">○ '+(isZH()?"無法啟動重新掃描":"Could not start the re-scan")+'</span>');return;}
          }
          var before=planCount(),newPlans=0,newTrips=0,pass=0,MAX=12,drained=false,parserDown=false,left=null,g=null;
          while(pass<MAX){
            pass++;
            var passPrompt = isZH()
              ? ('同步輪次 '+pass+(left!==null?' — 尚有 '+left+' 封郵件排隊中':' — 正在讀取新郵件')+'… <span class="opt">'+
                (newPlans||newTrips?'('+(newTrips?newTrips+' 趟新旅程, ':'')+newPlans+' 個新細項已匯入)':'(您可以關閉此視窗 — 其餘會在背景自動完成)')+'</span>')
              : ('Sync pass '+pass+(left!==null?' — '+left+' emails still queued':' — reading new emails')+'… <span class="opt">'+
                (newPlans||newTrips?'('+(newTrips?newTrips+' new trip'+(newTrips>1?'s':'')+', ':'')+newPlans+' new plan'+(newPlans===1?'':'s')+' so far)':'(you can close this — the rest finishes by itself in the background)')+'</span>');
            setGStatus(passPrompt);
            var stats=null;
            try{var sr=await fetch(apiBase()+"/sync"+(pass>1?"?only=gmail":""),{method:"POST",headers:authHeaders()});stats=await sr.json();}catch(e){}
            await refresh();
            var after=planCount();
            newPlans+=Math.max(0,after.plans-before.plans);newTrips+=Math.max(0,after.trips-before.trips);before=after;
            g=stats&&stats.gmail;
            if(g){left=g.remaining;
              if(g.remaining===0){drained=true;break;}
              if(g.failed>0&&g.parsed===0){parserDown=true;break;}
            }
          }
          var bits=[];
          if(newTrips)bits.push(isZH()?(newTrips+' 趟新旅程'):(newTrips+' new trip'+(newTrips>1?'s':'')));
          if(newPlans)bits.push(isZH()?(newPlans+' 個新細項'):(newPlans+' new plan'+(newPlans>1?'s':'')));
          var out=drained
            ?(isZH()
              ? ('<span style="color:var(--green)">● 完成（共執行 '+pass+' 輪）— '+(bits.length?bits.join('、'):'無新增預訂')+ '。所有符合的郵件皆已讀取完畢。</span>')
              : ('<span style="color:var(--green)">● Done after '+pass+' pass'+(pass>1?'es':'')+' — '+(bits.length?bits.join(', '):'nothing new found')+'. Every matching email has been read.</span>'))
            :(isZH()
              ? ('<span style="color:var(--amber)">◐ 已在第 '+pass+' 輪暫停 — '+(bits.length?bits.join('、'):'目前無新增項目')+ '。</span>')
              : ('<span style="color:var(--amber)">◐ Stopped after '+pass+' pass'+(pass>1?'es':'')+' — '+(bits.length?bits.join(', '):'nothing new yet')+'.</span>'));
          if(parserDown)out+='<br><span style="color:var(--coral)">○ '+(isZH()?'無法連線至郵件解析服務 — 請檢查「郵件智慧解析」下方的 Anthropic API 金鑰，然後再次點擊「重新掃描信箱」。':'The email parser could not be reached — check the Anthropic API key under Email parsing, then tap Re-scan inbox again.')+'</span>';
          else if(!drained)out+='<br><span style="color:var(--amber)">◐ '+(left!==null?(isZH()?'尚有 '+left+' 封符合的郵件排隊中':left+' matching emails still queued'):(isZH()?'收件匣中可能還有更多信件':'The inbox may hold more'))+' — '+(isZH()?'無需其他操作：系統會在接下來的數小時內於背景自動匯入。（亦可隨時點擊「重新掃描信箱」立即處理）':'no action needed: they import automatically in the background over the next hours. (Tap Re-scan inbox to finish now instead.)')+'</span>';
          if(g&&g.unfiled>0){
            var uf=null;
            try{var tr=await fetch(apiBase()+"/google/test",{headers:authHeaders()});uf=(await tr.json()).unfiled;}catch(e){}
            if(uf&&uf.length)out+='<br><span style="color:var(--amber)">◐ '+(isZH()?'已解析但尚未歸檔 — 日期未落在任何旅程中：':'Parsed but not filed — no trip covers their dates:')+'</span><br><span class="opt">'+
              uf.map(function(u){return esc(u.name)+' ('+esc(u.start)+(u.end&&u.end!==u.start?' – '+esc(u.end):'')+')';}).join(' · ')+
              '</span> — '+(isZH()?'請建立涵蓋該日期的旅程後，再次點擊「重新掃描信箱」。':'create or widen a trip around those dates, then tap Re-scan inbox once more.');
          }
          setGStatus(out);
          toast(bits.length?(isZH()?('收件匣已匯入 — '+bits.join('、')+' ✓'):('Inbox imported — '+bits.join(', ')+' ✓')):(drained?(isZH()?'收件匣已掃描完畢 — 未發現新預訂':'Inbox scanned — nothing new found'):(isZH()?'掃描提早結束 — 請參閱設定說明':'Scan stopped early — see Settings for why')));
        }catch(e){setGStatus('<span style="color:var(--faint)">'+(isZH()?"無法連線至 Worker。":"Worker not reachable.")+'</span>');}
        finally{for(i=0;i<btnIds.length;i++){el=document.getElementById(btnIds[i]);if(el)el.disabled=false;}}
      }

      var gResetBtn = document.getElementById("gReset");
      if(gResetBtn) gResetBtn.onclick=function(){
        if(!confirm(isZH()?"確定要清除所有旅程中「自動匯入」的細項，並透過智慧過濾重新匯入嗎？（你手動新增的細項將完整保留）":"Remove ALL auto-imported plans from every trip and re-import them fresh through the relevance filter? Plans you added by hand stay."))return;

    if(isAdmin){
      // Weekly snapshots: list what the worker has kept and offer one-tap restore.
      async function loadSnaps(){
        var el=document.getElementById("snapList");if(!el)return;
        if(!settings.workerUrl){el.textContent=isZH()?"雲端自動快照需搭配 Worker 運作 — 請先於上方填寫 Worker 網址。":"Automatic snapshots live on your worker — set a Worker URL above first.";return;}
        try{var r=await fetch(apiBase()+"/backups",{headers:authHeaders()});var d=await r.json();
          if(!r.ok){el.textContent=isZH()?"請先登入以檢視快照。":"Sign in to see snapshots.";return;}
          if(!d.backups||!d.backups.length){el.innerHTML=isZH()?"<b>自動快照：</b>每週日系統會自動完整備份你的所有資料（保留最近 4 週）。目前尚無快照 — 首份快照將於本週日建立。":"<b>Automatic snapshots:</b> a full copy of your data is kept every Sunday (last 4 weeks). None yet — the first lands this Sunday.";return;}
          el.innerHTML=(isZH()?"<b>雲端自動快照</b> — 還原將套用該份備份（當前資料會先自動備份，隨時可復原）：<br>":"<b>Automatic snapshots</b> — restore replaces everything with that copy (the current data is snapshotted first, so a restore is undoable):<br>")+
            d.backups.map(function(b){var dd=new Date(b.at);return '<button class="btn" style="margin:6px 6px 0 0" data-restore="'+b.slot+'">'+dd.toLocaleDateString(isZH()?"zh-TW":"en-US")+(isZH()?(' · '+b.trips+' 趟旅程'):(' · '+b.trips+' trips'))+'</button>';}).join("");
          el.querySelectorAll("[data-restore]").forEach(function(btn){btn.onclick=async function(){
            if(!confirm((isZH()?"確定要使用此快照（":"Replace ALL current trips and plans with this snapshot (")+btn.textContent.trim()+(isZH()?"）替換目前所有的旅程與細項嗎？":")?")))return;
            try{var rr=await fetch(apiBase()+"/backups/restore",{method:"POST",headers:Object.assign({"Content-Type":"application/json"},authHeaders()),body:JSON.stringify({slot:btn.dataset.restore})});
              var dd2=await rr.json();
              if(rr.ok){toast(isZH()?("已還原 "+dd2.trips+" 趟旅程 ✓"):("Restored "+dd2.trips+" trips ✓"));closeModal();await refresh();}
              else toast(dd2.error||(isZH()?"無法還原":"Could not restore"));}
            catch(e){toast(isZH()?"無法連線至 Worker":"Worker not reachable");}
          };});

            var regToggle = document.getElementById("adminAllowRegToggle");

                regStatus.textContent = isRegOpen ? (isZH() ? "● 開放中" : "● Open") : (isZH() ? "○ 已關閉" : "○ Closed");

            : '<span style="color:var(--green);font-weight:600">● ' + (isZH() ? '正常' : 'Active') + '</span>';

            '<td><div style="font-weight:600">' + esc(u.email || u.uid) + '</div><div style="font-size:11px;color:var(--muted);font-family:var(--mono)">' + esc(u.uid) + '</div></td>' +

            if(res.ok){

  function doImport(raw){var err=document.getElementById("imperr");if(err)err.textContent="";var data;try{data=JSON.parse(raw);}catch(e){if(err)err.textContent=isZH()?"無效的 JSON 格式。":"Not valid JSON.";return;}
    var inT=Array.isArray(data)?data:(data.trips||[]);var have={};trips.forEach(function(t){have[tripSig(t)]=1;});
    inT.forEach(function(t){if(!t)return;var nt={id:uid(),from:t.from||t.origin||"",to:t.to||t.destination||t.city||"",start:norm(t.start||t.startDate||t.arrival),end:norm(t.end||t.endDate||t.departure),label:t.label||t.title||t.name||"",notes:t.notes||"",segments:t.segments||[]};if(!nt.start||!nt.end)return;if(!have[tripSig(nt)]){trips.push(nt);have[tripSig(nt)]=1;}});
    if(!Array.isArray(data)&&data.wishes)data.wishes.forEach(function(w){if(w)wishes.push({id:uid(),from:w.from||"",dest:w.dest||"",days:w.days||"",month:w.month||"",budget:w.budget||"",note:w.note||""});});
    ensureIds();save("trips",trips);save("wishes",wishes);}
