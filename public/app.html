  function authHeaders(){ return authToken ? {"X-Auth":authToken} : {}; }
  var authScrim=document.getElementById("authScrim");
  var appAuthStatus={set:true,allowRegistration:false,authenticated:false,currentUser:null};

  // Log out on this device: clear the server session cookie + local token/cache,
  // then let refresh() hit /trips (now 401) and show the sign-in wall.
  async function doLogout(){
    var base=settings.workerUrl||location.origin;
    try{ await fetch(base+"/auth/logout",{method:"POST",headers:authHeaders()}); }catch(e){}
    var u = getCurrentUser();
    authToken="";
    saveCurrentUser(null);
    try{
      localStorage.removeItem("travel:auth");
      localStorage.removeItem("travel:user");
      if(u && u.uid){
        localStorage.removeItem("travel:"+u.uid+":trips");
        localStorage.removeItem("travel:"+u.uid+":wishes");
      }
      localStorage.removeItem("travel:trips");
      localStorage.removeItem("travel:wishes");
    }catch(e){}
    trips=[]; wishes=[]; closeModal(); render();
    if(settings.workerUrl){ toast(isZH()?"已在此裝置登出":"Signed out"); await refresh(); }
    else { location.reload(); }
  }
  // Session token is kept for 30 days, then a fresh sign-in is asked for.
  function saveAuth(token){ try{localStorage.setItem("travel:auth",JSON.stringify({token:token,exp:Date.now()+30*86400000}));}catch(e){} }
  function loadAuth(){
    try{
      var raw=localStorage.getItem("travel:auth");if(!raw)return"";
      var o=null;try{o=JSON.parse(raw);}catch(e){}
      if(o&&o.token)return(o.exp&&o.exp<Date.now())?"":o.token;   // expired -> require sign-in
      return raw;                                                  // legacy plain token
    }catch(e){return"";}
  }

  async function fetchAuthStatus(){
    if(!settings.workerUrl)return null;
    try{
      var st=await fetch(settings.workerUrl+"/auth/status",{headers:authHeaders()});
      if(st.ok){
        var d=await st.json();
        appAuthStatus={
          set:Boolean(d.set),
          allowRegistration:Boolean(d.allowRegistration),
          authenticated:Boolean(d.authenticated),
          currentUser:d.currentUser||null
        };
        if(d.currentUser) saveCurrentUser(d.currentUser);
        if(d.googlePlacesConfigured!==undefined){
          settings.googlePlacesConfigured=Boolean(d.googlePlacesConfigured);
          try{ localStorage.setItem("travel:places_configured", d.googlePlacesConfigured?"1":"0"); }catch(e){}
        }
        return d;
      }
    }catch(e){}
    return null;
  }

  async function loadServerSettings(){

  async function refresh(){
    if(!settings.workerUrl){syncState="local";updateStatusChip();render();return;}
    try{
      var res=await fetch(settings.workerUrl+"/trips",{headers:Object.assign({Accept:"application/json"},authHeaders())});
      if(res.status===401){await showAuth("login");return refresh();}
      if(!res.ok)throw new Error("bad status");
      var data=await res.json();
      trips=(Array.isArray(data)?data:(data.trips||[])).map(function(t){return{id:t.id||uid(),from:t.from||"",to:t.to||"",start:norm(t.start),end:norm(t.end),label:t.label||"",notes:t.notes||"",segments:t.segments||[],photo:t.photo||"",calEventId:t.calEventId};});
      ensureIds();
      await save("trips",trips);syncState="synced";
      loadServerSettings();
    }catch(e){syncState="offline";}
    updateStatusChip();render();
  }

  function extractProposals(text){
    var propRegex = /:::proposal\s*([\s\S]*?)\s*:::/g;
    var proposals = [];
    var cleanText = text.replace(propRegex, function(match, jsonContent){
      try {
        var cleaned = jsonContent.trim();
        if(cleaned.indexOf("```json") === 0){
          cleaned = cleaned.replace(/^```json\s*/, "").replace(/```$/, "").trim();
        } else if(cleaned.indexOf("```") === 0){
          cleaned = cleaned.replace(/^```\s*/, "").replace(/```$/, "").trim();
        }
        cleaned = cleaned.replace(/,\s*([\]}])/g, "$1");
        var parsed = JSON.parse(cleaned);
        if(parsed && parsed.action === "add_segments" && Array.isArray(parsed.segments)){
          var propId = "prop_" + Date.now() + "_" + Math.random().toString(36).substr(2, 6);
          proposals.push({
            id: propId,
            data: parsed
          });
          return '\n\n__COPILOT_PROP_' + propId + '__\n\n';
        }
      } catch(e){
        console.warn("Proposal parsing failed:", e, jsonContent);
      }
      return "";
    });
    return { cleanText: cleanText.trim(), proposals: proposals };
  }

      '<button class="btn solid" id="copilotOpenSettingsBtn" style="margin-top:8px;font-size:14.5px;padding:10px 18px;display:inline-flex;align-items:center;gap:6px">'+lucideIcon('settings', 15)+' <span>' + (isZH() ? "立即前往「設定」配置金鑰" : "Go to Settings") + '</span></button>' +
    '</div>';
    copilotStream.appendChild(div);
    var btn = document.getElementById("copilotOpenSettingsBtn");
    if(btn){
      btn.onclick = function(){
        closeCopilot();
        document.getElementById("setBtn").click();
      };
    }
    scrollCopilotToBottom();
  }

  function renderCopilotError(errMsg){
    var div = document.createElement("div");
    div.className = "copilot-msg assistant";
    div.innerHTML = '<div class="copilot-bubble" style="border-color:rgba(255,90,53,.3);background:rgba(255,90,53,.06);color:var(--coral)">' +
      '<div>⚠️ ' + esc(errMsg) + '</div>' +
    '</div>';
    copilotStream.appendChild(div);
    scrollCopilotToBottom();
  }

  async function sendCopilotMessage(userText){
    var text = (userText !== undefined ? userText : (copilotInput ? copilotInput.value : "")).trim();
    if(!text || copilotInFlight) return;

    if(copilotInput){
      copilotInput.value = "";
      copilotInput.style.height = "auto";
    }
    copilotInFlight = true;
    if(copilotSendBtn) copilotSendBtn.disabled = true;

    copilotMessages.push({ role: "user", content: text });
    renderCopilotMessage({ role: "user", content: text });

    var thinkingEl = document.createElement("div");
    thinkingEl.className = "copilot-thinking";
    thinkingEl.id = "copilotThinking";
    thinkingEl.innerHTML = '<span class="copilot-spinner"></span><span>' + (isZH() ? "AI 特助正在思考與彙整行程資訊..." : "AI Copilot is reviewing itinerary details...") + '</span>';
    copilotStream.appendChild(thinkingEl);
    scrollCopilotToBottom();

    try {
      var res = await fetch((settings.workerUrl || "") + "/ai/chat", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
        body: JSON.stringify({
          messages: copilotMessages.slice(-10),
          currentTripId: copilotTripId || undefined
        })
      });

      var data = await res.json().catch(function(){ return {}; });
      var th = document.getElementById("copilotThinking");
      if(th) th.remove();

      if(!res.ok || !data.ok){
        if(data.error === "NO_LLM_KEY"){
          renderNoKeyError();
        } else {
          renderCopilotError(data.message || (isZH() ? "連線 AI 服務時發生錯誤，請稍後重試。" : "Error communicating with AI service."));
        }
        return;
      }

      var reply = data.reply || "";
      var extracted = extractProposals(reply);
      var asstMsg = {
        role: "assistant",
        content: extracted.cleanText,
        proposals: extracted.proposals,
        fallbackUsed: Boolean(data.fallbackUsed),
        fallbackModel: data.model || "",
        primaryModel: data.primaryModel || ""
      };
      extracted.proposals.forEach(function(p){
        copilotProposals[p.id] = p;
      });

      copilotMessages.push(asstMsg);
      renderCopilotMessage(asstMsg);

    } catch(err){
      console.error("Copilot request error:", err);
      var thErr = document.getElementById("copilotThinking");
      if(thErr) thErr.remove();
      renderCopilotError(isZH() ? "網路連線異常，請確認網路連線或稍後再試。" : "Network error, please check connection.");
    } finally {
      copilotInFlight = false;
      if(copilotSendBtn) copilotSendBtn.disabled = false;
      if(copilotInput) copilotInput.focus();
      scrollCopilotToBottom();
    }
  }

  async function applyProposal(propId){
    var prop = copilotProposals[propId];
    if(!prop || prop.applied) return;
    prop.applied = true; // Guard immediately against double-clicks

    var actsEl = document.getElementById("acts_" + propId);
    if(actsEl){
      actsEl.innerHTML = '<span class="copilot-prop-status applied">⏳ ' + (isZH() ? "正在儲存至行程..." : "Saving...") + '</span>';
    }

    var targetTripId = prop.data.tripId || copilotTripId;
    var targetTrip = trips.find(function(t){ return t.id === targetTripId; });

    if(!targetTrip){
      var up = trips.filter(isUpcoming);
      targetTrip = up.length ? up[0] : trips[0];
    }

    if(!targetTrip){
      prop.applied = false;
      if(actsEl){
        actsEl.innerHTML = '<span style="color:var(--coral);font-size:13px;">' + (isZH() ? "⚠️ 尚未建立任何旅程，請先在主頁點擊「+ 新增旅程」" : "⚠️ No trip found, please add a trip first") + '</span>';
      }
      return;
    }

    if(!targetTrip.segments) targetTrip.segments = [];

    var segments = prop.data.segments || [];
    segments.forEach(function(s){
      var newSeg = {
        sid: uid(),
        source: "manual",
        type: s.type || "other",
        name: s.name || (isZH() ? "未命名細項" : "Untitled item"),
        address: s.address || "",
        start: s.start || targetTrip.start || "",
        end: s.end || "",
        note: s.note || "",
        conf: s.conf || ""
      };
      if(s.fallback && s.fallback.name){
        newSeg.fallback = {
          name: s.fallback.name,
          address: s.fallback.address || "",
          note: s.fallback.note || ""
        };
      }
      targetTrip.segments.push(newSeg);
    });

    targetTrip.segments = dedupeSegs(targetTrip.segments);
    targetTrip.updatedAt = Date.now();

    try {
      await persistTrip(targetTrip);
      render();
      if(actsEl){
        actsEl.innerHTML = '<span class="copilot-prop-status applied">✓ ' + (isZH() ? "已成功套用至「" + esc(targetTrip.label || targetTrip.to) + "」" : "Applied to " + esc(targetTrip.label || targetTrip.to)) + '</span>';
      }
      toast(isZH() ? "✓ 已成功將 " + segments.length + " 個項目加入行程！" : "✓ " + segments.length + " items added to itinerary!");
    } catch(err){
      console.error("Save trip error:", err);
      prop.applied = false;
      if(actsEl){
        actsEl.innerHTML = '<span style="color:var(--coral);font-size:13px;">' + (isZH() ? "儲存失敗，請重試" : "Failed to save") + '</span>';
      }
    }
  }

  function dismissProposal(propId){
    var prop = copilotProposals[propId];
    if(!prop) return;
    prop.dismissed = true;
    var actsEl = document.getElementById("acts_" + propId);
    if(actsEl){
      actsEl.innerHTML = '<span class="copilot-prop-status dismissed">' + (isZH() ? "✕ 已忽略此提案" : "✕ Dismissed") + '</span>';
    }
  }

  // Copilot Event Listeners
  if(copilotBtn){
    copilotBtn.onclick = function(){ openCopilot(null); };
  }
  if(copilotCloseBtn){
    copilotCloseBtn.onclick = closeCopilot;
  }
  if(copilotScrim){
    copilotScrim.addEventListener("click", function(e){
      if(e.target === copilotScrim) closeCopilot();
    });
  }
  if(copilotContextClearBtn){
    copilotContextClearBtn.onclick = function(){
      copilotTripId = null;
      updateCopilotContextUI();
      toast(isZH() ? "已切換為全行程視野" : "Switched to all-trips view");
    };
  }
  if(copilotInput){
    copilotInput.addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendCopilotMessage();
      }
    });
    copilotInput.addEventListener("input", function(){
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });
  }
  if(copilotSendBtn){
    copilotSendBtn.onclick = function(){ sendCopilotMessage(); };
  }
  if(copilotStream){
    copilotStream.addEventListener("click", function(e){
      var chip = e.target.closest("[data-chip]");
      if(chip){
        sendCopilotMessage(chip.dataset.chip);
        return;
      }
      var applyBtn = e.target.closest("[data-applyprop]");
      if(applyBtn){
        applyProposal(applyBtn.dataset.applyprop);
        return;
      }
      var dismissBtn = e.target.closest("[data-dismissprop]");
      if(dismissBtn){
        dismissProposal(dismissBtn.dataset.dismissprop);
        return;
      }
    });
  }

  /* ===================== init (preserved seeding) ===================== */
  // When served from the worker itself, adopt its own origin as the sync URL so
  // the user never pastes anything. Stays local on a static-only host or file://.
  async function probeOrigin(){
    if(settings.workerUrl)return;                     // an explicit URL always wins
    if(location.protocol.indexOf("http")!==0)return;  // file:// -> stay local
    try{
      var c=new AbortController(),to=setTimeout(function(){c.abort();},4000);
      var res=await fetch(location.origin+"/auth/status",{signal:c.signal});  // unauthenticated worker check
      clearTimeout(to);
      if(res.ok){
        settings.workerUrl=location.origin;   // not persisted: always reflects where it is served
        var stData = await res.json().catch(function(){return null;});
        if(stData && stData.googlePlacesConfigured !== undefined){
          settings.googlePlacesConfigured = Boolean(stData.googlePlacesConfigured);
          try{ localStorage.setItem("travel:places_configured", stData.googlePlacesConfigured ? "1" : "0"); }catch(e){}
        }
      }
    }catch(e){}
  }
  (async function(){
    trips=await load("trips",null);wishes=await load("wishes",null);home=await load("home",null);homeTz=await load("homeTz",null);settings=await load("settings",null)||{workerUrl:""};
    settings.googlePlacesConfigured = (function(){
      try{ return localStorage.getItem("travel:places_configured") === "1"; }catch(e){ return false; }
    })();
    var firstRun=(trips===null&&wishes===null);
    if(trips===null)trips=[];if(wishes===null)wishes=[];
    if(!home)home=isZH()?"TPE":"OPO";
    if(!homeTz)homeTz=getHomeTz();
    await probeOrigin();
    // Seed sample trip only in pure local mode; when synced worker store is source of truth.
    if(firstRun && !settings.workerUrl){
      if(isZH()){
        trips=[{id:uid(),from:"TPE",to:"NRT",start:"2026-10-15",end:"2026-10-20",label:"東京秋季漫步自由行",timezone:"Asia/Tokyo",segments:[
          {type:"flight",name:"星宇航空 JX800 台北 TPE 至 東京 NRT",start:"2026-10-15T08:30",address:"台北桃園機場第一航廈",conf:"seed1"},
          {type:"hotel",name:"東京目黑星野 OMO5 飯店",start:"2026-10-15",end:"2026-10-20",address:"東京都目黑區",conf:"seed2"},
          {type:"rail",name:"京成 Skyliner 機場快線",start:"2026-10-15T13:00",address:"成田機場第二航廈",conf:"seed3"},
          {type:"flight",name:"星宇航空 JX801 東京 NRT 至 台北 TPE",start:"2026-10-20T14:15",address:"東京成田機場第二航廈",conf:"seed4"}
        ]}];
        wishes=[{id:uid(),from:"TPE",dest:"京都 / KIX",days:"6",month:"November",budget:"NT$35,000",note:"賞楓季直飛航班，行程彈性。"}];
      } else {
        trips=[{id:uid(),from:"OPO",to:"FNC",start:"2026-09-15",end:"2026-09-18",label:"Build Days - Madeira",timezone:"Atlantic/Madeira",segments:[
          {type:"flight",name:"TAP TP1693 OPO to FNC",start:"2026-09-15",address:"Porto to Funchal",conf:"seed1"},
          {type:"hotel",name:"Castanheiro Boutique Hotel",start:"2026-09-15",end:"2026-09-18",address:"Rua do Castanheiro 31, Funchal",conf:"seed2"},
          {type:"ride",name:"Airport pickup",start:"2026-09-15",address:"FNC arrivals",conf:"seed3"},
          {type:"flight",name:"TAP TP1694 FNC to OPO",start:"2026-09-18",address:"Funchal to Porto",conf:"seed4"}
        ]}];
        wishes=[{id:uid(),from:"OPO",dest:"",days:"5",month:"August",budget:"€400",note:"Anywhere warm, flexible dates, direct if possible."}];
      }
      openSet[trips[0].id]=true;
      save("trips",trips);save("wishes",wishes);save("home",home);save("homeTz",homeTz);
    }
    ensureIds();
    updateStaticTexts();
    document.documentElement.lang = isZH() ? "zh-Hant-TW" : "en";
    updateStatusChip();
    if(settings.workerUrl){
      render();
      await ensureAuth();                 // password gate (synced mode)
      await loadServerSettings();
      await refresh();
      if(!trips.length)await syncNow();   // first open against an empty store: auto-pull from Calendar
    }else{render();}
  })();
})();
</script>
